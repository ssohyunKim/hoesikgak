# 회식각 API (Cloudflare Worker)
# 배포: cd worker && npx wrangler deploy
# 비밀값은 여기 적지 말고 `npx wrangler secret put 이름` 으로 넣는다:
#   KAKAO_REST_KEY       카카오 REST API 키
#   KAKAO_CLIENT_SECRET  카카오 로그인 > 보안 > Client Secret (켜져 있을 때만)
#   KAKAO_ADMIN_KEY      카카오 대표 어드민 키 (연결 끊기 웹훅 검증용)
#   SESSION_SECRET       아무 긴 무작위 문자열. 바꾸면 기존 로그인이 전부 풀리고 작성자 uid 도 달라진다
name = "hoesikgak-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://www.hoesikgak.com,https://ssohyunkim.github.io"
REDIRECT_URIS   = "https://www.hoesikgak.com/"
KAKAO_APP_ID    = ""   # 카카오 콘솔의 앱 ID (숫자). 비워두면 연결 끊기 웹훅의 app_id 를 확인하지 않는다

# 사용자가 등록한 기준 위치(우리 회사)
[[kv_namespaces]]
binding = "PROFILE"
id = "74e4c2c9be4e4463a06f587b616e85f1"

# 가게·평가. 표 만들기: npx wrangler d1 execute hoesikgak --remote --file=./schema.sql
[[d1_databases]]
binding = "DB"
database_name = "hoesikgak"
database_id = "f1ce72f8-9cde-4449-9d20-d767b9f21fc5"

# 세션 강제 만료(계정 비활성화·세션 만료 웹훅)를 쓰려면 KV 를 만들어 붙인다:
#   npx wrangler kv namespace create REVOKED   → 나온 id 를 아래에 넣고 주석을 푼다
# [[kv_namespaces]]
# binding = "REVOKED"
# id = ""
