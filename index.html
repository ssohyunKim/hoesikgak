<head>

<!-- 브라우저 탭 아이콘 · 홈 화면 아이콘 -->
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="회식각">

<!-- 링크를 붙여넣었을 때 뜨는 미리보기 (카카오톡·슬랙 공통) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="회식각">
<meta property="og:title" content="회식각 — 오늘도 못 정했지?">
<meta property="og:description" content="상황만 골라. 나머지는 룰렛이 정한다.">
<meta property="og:url" content="https://www.hoesikgak.com/">
<meta property="og:image" content="https://www.hoesikgak.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<!-- 첫 화면이 낮 색으로 번쩍이지 않게 테마를 먼저 정한다 (js/theme.js 와 같은 규칙) -->
<script>
  (function () {
    var d = new Date(), h = d.getHours(), t = h >= 5 && h < 17 ? "day" : "night";
    try {
      var s = JSON.parse(localStorage.getItem("hoesik.theme") || "null");
      var ymd = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
      if (s && s.day === ymd) t = s.theme;
    } catch (e) {}
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div class="marq" aria-hidden="true"><span id="marq"></span></div>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#/">회식<b>각</b></a>
    <button class="iconbtn" id="mapBtn" aria-label="지도 보기">🗺 지도</button>
    <button class="iconbtn" id="meBtn" aria-label="내 평가" hidden>👤</button>
    <button class="iconbtn" id="themeBtn" aria-label="밝게/어둡게">🌙</button>
  </div>
</header>
<main id="view"></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<footer class="foot"><div class="wrap">

</div></footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
